name: foundation-certification

on:
  workflow_dispatch:
  # Full certification is required before merging into a protected Foundation branch.
  pull_request:
    branches:
      - "foundation/runtime-*"
  # Full certification also runs when a runtime harness/gate changes on the active feature branch.
  # Routine product code pushes use the quick lane; a Draft Foundation PR is the normal full-gate path.
  push:
    branches:
      - "feature/operator-identity-v1"
      - "integration/runtime-operator-v1"
      - "security/**"
    paths:
      - ".github/workflows/foundation-certification.yml"
      - "scripts/check-work-item-docs.ps1"
      - "docs/planning/pre-commercial-readiness-gate.md"
      - "docs/planning/master-build-plan.md"
      - "docs/planning/engineering-readiness-register.md"
      - "docs/planning/requirements-traceability.md"
      - "docs/planning/capability-matrix.md"
      - "docs/development/roadmap-and-current-checkpoint.md"
      - "docs/operations/branch-governance.md"
      - "docs/operations/stable-checkpoint.md"
      - "docs/decisions/ADR-0002-server-secret-store-and-agent-enrollment.md"
      - ".github/workflows/foundation-runtime.yml"
      - "scripts/check-ci-runner-policy.ps1"
      - ".github/workflows/runtime-lan-smoke-payload.yml"
      - "scripts/configure-agent-runtime-state.ps1"
      - "docs/operations/agent-service-state.md"
      - "scripts/verify-identity-runtime.ps1"
      - "scripts/verify-postgresql.ps1"
      - "scripts/verify-backup-restore.ps1"
      - "scripts/verify-desktop-runtime.ps1"
      - "scripts/verify-agent-runtime.ps1"
      - "scripts/verify-server-tls-certificate.ps1"
      - "scripts/modules/**"
      - "scripts/write-protected-server-settings.ps1"
      - "scripts/finalize-server-setup.ps1"
      - "scripts/configure-server-tls.ps1"
      - "scripts/publish-deployment-payloads.ps1"
      - "scripts/verify.ps1"
      - "src/Server/Infrastructure/Configuration/**"
      - "src/Server/Infrastructure/Security/**"
      - "src/Server/Persistence/**"
      - "src/Shared/Contracts/V1/Security/**"
      - "tests/Server.UnitTests/**"
      - "src/Client/**"
      - "src/Shared/Contracts/V1/Protocol/**"
      - "src/Server/Infrastructure/Realtime/**"
      - "src/Server/Modules/Stations/**"
      - "src/Desktop/Features/Stations/**"
      - "src/Desktop/Shell/MainWindow.xaml.cs"
      - "tests/Agent.Tests/**"
      - "tests/Desktop.Tests/**"
      - "src/Desktop/Features/Stations/**"
      - "src/Desktop/Shell/MainWindow.xaml"
      - "src/Desktop/Resources/Strings.en-US.xaml"
      - "src/Desktop/Resources/Strings.fa-IR.xaml"
      - "tests/Desktop.Tests/StationBoardFilterTests.cs"

concurrency:
  group: foundation-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    timeout-minutes: 45
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: CI runner policy guard
        shell: pwsh
        run: .\scripts\check-ci-runner-policy.ps1


      - name: PowerShell parser gate
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($file in Get-ChildItem .\scripts -Recurse -File | Where-Object { $_.Extension -in @(".ps1", ".psm1") }) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $details = @($errors | ForEach-Object {
                "line $($_.Extent.StartLineNumber), column $($_.Extent.StartColumnNumber): $($_.Message)"
              }) -join "; "
              throw "PowerShell syntax error in $($file.FullName): $details"
            }
          }

      - name: Canonical verification
        timeout-minutes: 15
        shell: pwsh
        run: .\scripts\verify.ps1

      - name: Prepare disposable PostgreSQL certification database
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $serviceName = "postgresql-x64-17"
          $service = Get-Service -Name $serviceName -ErrorAction Stop
          if ($service.Status -ne "Running") {
            Set-Service -Name $serviceName -StartupType Manual
            Start-Service -Name $serviceName
          }

          $psql = Join-Path $env:ProgramFiles "PostgreSQL\17\bin\psql.exe"
          $dotnet = (Get-Command dotnet -ErrorAction Stop).Source
          if (-not (Test-Path -LiteralPath $psql -PathType Leaf)) {
            throw "PostgreSQL 17 client was not found on the hosted Windows image."
          }

          # This password exists only inside the disposable hosted VM; it is not a repository secret.
          $env:PGPASSWORD = "root"
          Write-Output "::add-mask::root"
          & $psql --host=127.0.0.1 --port=5432 --username=postgres --dbname=postgres --set=ON_ERROR_STOP=1 --command="CREATE DATABASE gamenet_foundation_probe;"
          if ($LASTEXITCODE -ne 0) {
            $exists = (& $psql --host=127.0.0.1 --port=5432 --username=postgres --dbname=postgres --tuples-only --no-align --command="SELECT 1 FROM pg_database WHERE datname = 'gamenet_foundation_probe';" 2>&1) -join ""
            if ($LASTEXITCODE -ne 0 -or $exists.Trim() -ne "1") {
              throw "Could not create the disposable Foundation database."
            }
          }

          $connection = "Host=127.0.0.1;Port=5432;Database=gamenet_foundation_probe;Username=postgres;Password=root;Include Error Detail=true;Pooling=false"
          Write-Output "::add-mask::$connection"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "GAMENET_DATABASE_CONNECTION=$connection"
          $env:GAMENET_DATABASE_CONNECTION = $connection

          & $dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw "Could not restore the local dotnet-ef tool." }
          & $dotnet ef database update --configuration Release --project src/Server/GameNet.Server.csproj --startup-project src/Server/GameNet.Server.csproj --context GameNet.Server.Persistence.GameNetDbContext
          if ($LASTEXITCODE -ne 0) { throw "Could not initialize the disposable Foundation database with the repository migrations." }

          Remove-Item Env:PGPASSWORD -ErrorAction SilentlyContinue

      - name: PostgreSQL certification
        timeout-minutes: 15
        shell: pwsh
        run: .\scripts\verify-postgresql.ps1

      - name: Backup and isolated restore certification
        timeout-minutes: 10
        shell: pwsh
        run: .\scripts\verify-backup-restore.ps1

      - name: Desktop runtime certification
        timeout-minutes: 10
        shell: pwsh
        run: .\scripts\verify-desktop-runtime.ps1

      - name: Agent runtime certification
        timeout-minutes: 15
        shell: pwsh
        run: .\scripts\verify-agent-runtime.ps1

      - name: Upload failure diagnostics
        if: failure()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: foundation-failure-diagnostics
          path: |
            artifacts/foundation/*-diagnostic.txt
            artifacts/foundation/identity-runtime-diagnostic-*.txt
            artifacts/foundation/desktop-runtime-*
            artifacts/foundation/agent-runtime-*
          if-no-files-found: ignore

      - name: Evidence
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path .\artifacts\foundation | Out-Null
          @(
            "commit=$(git rev-parse HEAD)"
            "branch=$(git branch --show-current)"
            "timestampUtc=$([DateTime]::UtcNow.ToString('O'))"
            "result=FULL_FOUNDATION_CERTIFICATION_PASSED"
            "gates=PowerShellParser,CanonicalBuildAndTests,PostgreSQLCleanMigrationConcurrency,BackupIsolatedRestore,DesktopRuntime,AgentAuthLeaseHeartbeatFencingReconnect"
          ) | Set-Content -LiteralPath .\artifacts\foundation\foundation-evidence.txt -Encoding utf8

      - name: Upload evidence
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: foundation-certification-evidence
          path: artifacts/foundation/foundation-evidence.txt
          if-no-files-found: error
