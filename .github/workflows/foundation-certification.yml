name: foundation-certification

on:
  workflow_dispatch:
  # Reusable gate: Integration's required quick-validation job waits on this workflow.
  workflow_call:
  # Direct full certification for pull requests into protected Foundation branches.
  pull_request:
    branches:
      - "foundation/runtime-*"
  # Full certification also runs when a runtime harness/gate changes on the active feature branch.
  # Routine product code pushes use the quick lane; a Draft Foundation PR is the normal full-gate path.
  push:
    branches:
      - "feature/operator-identity-v1"
      - "feature/**"
      - "feat/**"
      - "integration/runtime-operator-v1"
      - "integration/runtime-*"
      - "integration/candidate-**"
      - "security/**"
      - "refactor/**"
      - "fix/**"
      - "topic/**"
      - "stage2/**"
    paths:
      - ".github/workflows/foundation-certification.yml"
      - ".github/workflows/foundation-runtime.yml"
      - ".github/workflows/gamenet.yml"
      - "scripts/check-ci-runner-policy.ps1"
      - ".github/workflows/runtime-lan-smoke-payload.yml"
      - "scripts/configure-agent-runtime-state.ps1"
      - "docs/operations/agent-service-state.md"
      - "scripts/verify-identity-runtime.ps1"
      - "scripts/verify-postgresql.ps1"
      - "scripts/verify-backup-restore.ps1"
      - "scripts/check-architecture.ps1"
      - "scripts/check-module-layer-boundaries.ps1"
      - "scripts/test-module-layer-boundaries.ps1"
      - "scripts/verify-desktop-runtime.ps1"
      - "scripts/verify-agent-runtime.ps1"
      - "scripts/verify-server-tls-certificate.ps1"
      - "scripts/modules/**"
      - "scripts/write-protected-server-settings.ps1"
      - "scripts/finalize-server-setup.ps1"
      - "scripts/configure-server-tls.ps1"
      - "scripts/publish-deployment-payloads.ps1"
      - "scripts/verify.ps1"
      - "src/Server/Infrastructure/Configuration/**"
      - "src/Server/Infrastructure/Security/**"
      - "src/Server/Infrastructure/Outbox/**"
      - "src/Server/Persistence/**"
      - "src/Shared/Contracts/V1/Security/**"
      - "tests/Server.UnitTests/**"
      - "tests/Desktop.Tests/**"
      - "src/Desktop/**"
      - "src/Client/**"
      - "src/Shared/Contracts/V1/Protocol/**"
      - "src/Server/Infrastructure/Realtime/**"
      - "src/Server/Modules/README.md"
      - "src/Server/Modules/Stations/**"
      - "src/Desktop/Features/Stations/**"
      - "src/Desktop/Shell/MainWindow.xaml.cs"
      - "tests/Agent.Tests/**"
      - "tests/Desktop.Tests/**"
      - "src/Desktop/Features/Stations/**"
      - "src/Desktop/Shell/MainWindow.xaml"
      - "src/Desktop/Resources/Strings.en-US.xaml"
      - "src/Desktop/Resources/Strings.fa-IR.xaml"
      - "tests/Desktop.Tests/StationBoardFilterTests.cs"

concurrency:
  group: foundation-certification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Always emit a scope result on Integration PRs. Avoid a workflow-level paths filter:
  # that would leave a required status check Pending on Markdown-only changes.
  gate-scope:
    name: foundation-gate-scope
    timeout-minutes: 5
    runs-on: windows-2025
    outputs:
      run_foundation: ${{ steps.scope.outputs.run_foundation }}
    env:
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
      PUSH_BEFORE_SHA: ${{ github.event.before || '' }}
    steps:
      - name: Checkout diff history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect database and runtime-sensitive changes
        id: scope
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $eventName = $env:GITHUB_EVENT_NAME
          # A reusable workflow inherits the caller's event payload. Detect a PR from
          # its exact base/head fields even if the runner event name is workflow_call.
          if ($env:PR_BASE_SHA -match '^[0-9a-f]{40}$' -and $env:PR_HEAD_SHA -match '^[0-9a-f]{40}$') {
            $eventName = "pull_request"
          }
          $shouldRun = $false
          $changedFiles = @()

          if ($eventName -eq "workflow_dispatch") {
            $shouldRun = $true
          }
          elseif ($eventName -eq "pull_request") {
            $base = $env:PR_BASE_SHA
            $head = $env:PR_HEAD_SHA
            if ($base -notmatch '^[0-9a-f]{40}$' -or $head -notmatch '^[0-9a-f]{40}$') {
              throw "Cannot determine exact pull-request base/head SHA; full certification must not be silently skipped."
            }
            $changedFiles = @(& git diff --name-only "$base...$head")
            if ($LASTEXITCODE -ne 0) {
              throw "Could not calculate changed paths for the pull request."
            }
          }
          elseif ($eventName -eq "push") {
            $base = $env:PUSH_BEFORE_SHA
            $head = $env:GITHUB_SHA
            if ($base -notmatch '^[0-9a-f]{40}$' -or $base -match '^0{40}$' -or $head -notmatch '^[0-9a-f]{40}$') {
              $shouldRun = $true
            }
            else {
              $changedFiles = @(& git diff --name-only $base $head)
              if ($LASTEXITCODE -ne 0) {
                throw "Could not calculate changed paths for the push."
              }
            }
          }
          else {
            # Unknown event types fail closed: prefer an extra certification over a skipped gate.
            $shouldRun = $true
          }

          $sensitivePrefixes = @(
            ".github/",
            "scripts/",
            "src/",
            "tests/",
            ".config/"
          )
          $sensitiveRootFiles = @(
            "GameNet.slnx",
            "Directory.Build.props",
            "Directory.Build.targets",
            "Directory.Packages.props",
            "global.json",
            "NuGet.Config"
          )

          $normalizedPaths = @($changedFiles)
          $sensitiveChanges = @()
          foreach ($path in $normalizedPaths) {
            foreach ($prefix in $sensitivePrefixes) {
              if ($path.StartsWith($prefix, [System.StringComparison]::OrdinalIgnoreCase)) {
                $sensitiveChanges += $path
                break
              }
            }
            if ($sensitiveRootFiles -contains $path) {
              $sensitiveChanges += $path
            }
          }

          if (-not $shouldRun) {
            $shouldRun = $sensitiveChanges.Count -gt 0
          }

          $outputValue = $shouldRun.ToString().ToLowerInvariant()
          "run_foundation=$outputValue" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "FOUNDATION_GATE_REQUIRED=$outputValue"
          Write-Host "CHANGED_PATH_COUNT=$($normalizedPaths.Count)"
          Write-Host "SENSITIVE_PATH_COUNT=$($sensitiveChanges.Count)"

  foundation:
    needs: gate-scope
    # Foundation-targeted PRs always run full certification. For Integration, only
    # Markdown/docs-only PRs skip it; a failed scope calculation forces certification.
    if: >-
      always() &&
      (
        needs.gate-scope.result != 'success' ||
        github.event_name != 'pull_request' ||
        github.base_ref != 'integration/runtime-operator-v1' ||
        needs.gate-scope.outputs.run_foundation == 'true'
      )
    timeout-minutes: 45
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: CI runner policy guard
        shell: pwsh
        run: .\scripts\check-ci-runner-policy.ps1

      - name: Install repository-pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: PowerShell parser gate
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($file in Get-ChildItem .\scripts -Recurse -File | Where-Object { $_.Extension -in @(".ps1", ".psm1") }) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $details = @($errors | ForEach-Object {
                "line $($_.Extent.StartLineNumber), column $($_.Extent.StartColumnNumber): $($_.Message)"
              }) -join "; "
              throw "PowerShell syntax error in $($file.FullName): $details"
            }
          }

      - name: Canonical verification
        timeout-minutes: 15
        shell: pwsh
        run: .\scripts\verify.ps1

      - name: Prepare disposable PostgreSQL certification database
        id: prepare-postgres
        timeout-minutes: 10
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $serviceName = "postgresql-x64-17"
          $service = Get-Service -Name $serviceName -ErrorAction Stop
          if ($service.Status -ne "Running") {
            Set-Service -Name $serviceName -StartupType Manual
            Start-Service -Name $serviceName
          }

          $psql = Join-Path $env:ProgramFiles "PostgreSQL\17\bin\psql.exe"
          $dotnet = (Get-Command dotnet -ErrorAction Stop).Source
          if (-not (Test-Path -LiteralPath $psql -PathType Leaf)) {
            throw "PostgreSQL 17 client was not found on the hosted Windows image."
          }

          # This password exists only inside the disposable hosted VM; it is not a repository secret.
          $env:PGPASSWORD = "root"
          Write-Output "::add-mask::root"
          & $psql --host=127.0.0.1 --port=5432 --username=postgres --dbname=postgres --set=ON_ERROR_STOP=1 --command="CREATE DATABASE gamenet_foundation_probe;"
          if ($LASTEXITCODE -ne 0) {
            $exists = (& $psql --host=127.0.0.1 --port=5432 --username=postgres --dbname=postgres --tuples-only --no-align --command="SELECT 1 FROM pg_database WHERE datname = 'gamenet_foundation_probe';" 2>&1) -join ""
            if ($LASTEXITCODE -ne 0 -or $exists.Trim() -ne "1") {
              throw "Could not create the disposable Foundation database."
            }
          }

          $connection = "Host=127.0.0.1;Port=5432;Database=gamenet_foundation_probe;Username=postgres;Password=root;Include Error Detail=true;Pooling=false"
          Write-Output "::add-mask::$connection"
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "GAMENET_DATABASE_CONNECTION=$connection"
          $env:GAMENET_DATABASE_CONNECTION = $connection

          # Execute the exact read-only database preflight SQL from the Slice 1
          # launcher against a newly created, disposable database as a low-privilege
          # login. This validates SQL/catalog access, not just PowerShell syntax.
          $preflightSource = Get-Content -LiteralPath ".\scripts\run-slice1-process-acceptance.ps1" -Raw
          $preflightSqlMatch = [regex]::Match($preflightSource, '(?s)\$query\s*=\s*@"\r?\n(?<sql>.*?)\r?\n"@')
          if (-not $preflightSqlMatch.Success) {
            throw "Could not extract the Slice 1 read-only database preflight SQL for certification."
          }
          $preflightSql = $preflightSqlMatch.Groups["sql"].Value
          $preflightRole = "gamenet_preflight_" + [Guid]::NewGuid().ToString("N")
          $preflightPassword = [Guid]::NewGuid().ToString("N")
          $preflightRoleCreated = $false
          $previousPsqlPassword = $env:PGPASSWORD
          try {
            $createPreflightRoleSql = "CREATE ROLE $preflightRole LOGIN PASSWORD '$preflightPassword';"
            & $psql --host=127.0.0.1 --port=5432 --username=postgres --dbname=postgres --set=ON_ERROR_STOP=1 --command=$createPreflightRoleSql
            if ($LASTEXITCODE -ne 0) {
              throw "Could not create the disposable low-privilege role for Slice 1 preflight SQL certification."
            }
            $preflightRoleCreated = $true

            $env:PGPASSWORD = $preflightPassword
            Write-Output "::add-mask::$preflightPassword"
            $preflightOutput = @(& $psql --host=127.0.0.1 --port=5432 --username=$preflightRole --dbname=gamenet_foundation_probe --tuples-only --no-align --no-password --command=$preflightSql 2>&1)
            $preflightExitCode = $LASTEXITCODE
            $preflightResult = ($preflightOutput -join [Environment]::NewLine).Trim()
            if ($preflightExitCode -ne 0) {
              throw "Slice 1 database preflight SQL failed against a fresh database using a non-elevated role. Output: $preflightResult"
            }
            if ($preflightResult -ne "0|0|OK") {
              throw "Slice 1 database preflight SQL returned an unexpected fresh-database result. Expected 0|0|OK; observed '$preflightResult'."
            }
            Write-Host "SLICE1_DATABASE_PREFLIGHT_SQL_CERTIFICATION_PASSED=true"
          }
          finally {
            $env:PGPASSWORD = $previousPsqlPassword
            if ($preflightRoleCreated) {
              & $psql --host=127.0.0.1 --port=5432 --username=postgres --dbname=postgres --set=ON_ERROR_STOP=1 --command="DROP ROLE IF EXISTS $preflightRole;" 2>&1 | Out-Null
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Could not remove the disposable preflight role; the hosted CI database is ephemeral."
              }
            }
            $preflightPassword = $null
          }

          & $dotnet tool restore
          if ($LASTEXITCODE -ne 0) { throw "Could not restore the local dotnet-ef tool." }
          & $dotnet ef database update --configuration Release --project src/Server/GameNet.Server.csproj --startup-project src/Server/GameNet.Server.csproj --context GameNet.Server.Persistence.GameNetDbContext
          if ($LASTEXITCODE -ne 0) { throw "Could not initialize the disposable Foundation database with the repository migrations." }

          Remove-Item Env:PGPASSWORD -ErrorAction SilentlyContinue

      - name: Diagnose EF model snapshot drift
        if: failure() && steps.prepare-postgres.outcome == 'failure'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $snapshot = "src/Server/Persistence/Migrations/GameNetDbContextModelSnapshot.cs"
          $snapshotBackup = Join-Path $env:RUNNER_TEMP "GameNetDbContextModelSnapshot.cs"
          $diagnosticDir = "src/Server/Persistence/ModelDriftDiagnostics"
          Copy-Item -LiteralPath $snapshot -Destination $snapshotBackup -Force
          try {
            $dotnet = (Get-Command dotnet -ErrorAction Stop).Source
            & $dotnet ef migrations add ModelDriftDiagnostic --configuration Release --project src/Server/GameNet.Server.csproj --startup-project src/Server/GameNet.Server.csproj --context GameNet.Server.Persistence.GameNetDbContext --output-dir Persistence/ModelDriftDiagnostics
            $scaffoldExitCode = $LASTEXITCODE
            if (Test-Path -LiteralPath $diagnosticDir -PathType Container) {
              Get-ChildItem -LiteralPath $diagnosticDir -Filter "*_ModelDriftDiagnostic.cs" -File | ForEach-Object {
                Write-Output ("===== DIAGNOSTIC MIGRATION: " + $_.Name + " =====")
                Get-Content -LiteralPath $_.FullName
              }
            }
            if ($scaffoldExitCode -ne 0) {
              Write-Output "EF model-drift diagnostic migration could not be scaffolded; exit code: $scaffoldExitCode."
            }
          }
          finally {
            Copy-Item -LiteralPath $snapshotBackup -Destination $snapshot -Force
            Remove-Item -LiteralPath $diagnosticDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: PostgreSQL certification
        timeout-minutes: 15
        shell: pwsh
        run: .\scripts\verify-postgresql.ps1

      - name: Backup and isolated restore certification
        timeout-minutes: 10
        shell: pwsh
        run: .\scripts\verify-backup-restore.ps1

      - name: Desktop runtime certification
        timeout-minutes: 10
        shell: pwsh
        run: .\scripts\verify-desktop-runtime.ps1

      - name: Agent runtime certification
        timeout-minutes: 15
        shell: pwsh
        run: .\scripts\verify-agent-runtime.ps1

      - name: Upload failure diagnostics
        if: failure()
        timeout-minutes: 3
        uses: actions/upload-artifact@v4
        with:
          name: foundation-failure-diagnostics
          path: |
            artifacts/foundation/*-diagnostic.txt
            artifacts/foundation/identity-runtime-diagnostic-*.txt
            artifacts/foundation/desktop-runtime-*
            artifacts/foundation/agent-runtime-*
          if-no-files-found: ignore

      - name: Evidence
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path .\artifacts\foundation | Out-Null
          @(
            "commit=$(git rev-parse HEAD)"
            "branch=$(git branch --show-current)"
            "timestampUtc=$([DateTime]::UtcNow.ToString('O'))"
            "result=FULL_FOUNDATION_CERTIFICATION_PASSED"
            "gates=PowerShellParser,CanonicalBuildAndTests,PostgreSQLCleanMigrationConcurrency,BackupIsolatedRestore,DesktopRuntime,AgentAuthLeaseHeartbeatFencingReconnect"
          ) | Set-Content -LiteralPath .\artifacts\foundation\foundation-evidence.txt -Encoding utf8

      - name: Upload evidence
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: foundation-certification-evidence
          path: artifacts/foundation/foundation-evidence.txt
          if-no-files-found: error
