name: Build GameNet 98 CS2 LAN v0.4 Setup

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/GameNet98-CS2-LAN-source-v040.part*.txt'
      - '.github/workflows/cs2-lan-launcher-build.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reassemble and verify v0.4 source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $partPaths = @(
            "$env:GITHUB_WORKSPACE/tools/GameNet98-CS2-LAN-source-v040.part01.txt",
            "$env:GITHUB_WORKSPACE/tools/GameNet98-CS2-LAN-source-v040.part02.txt",
            "$env:GITHUB_WORKSPACE/tools/GameNet98-CS2-LAN-source-v040.part03.txt",
            "$env:GITHUB_WORKSPACE/tools/GameNet98-CS2-LAN-source-v040.part04-s01.txt",
            "$env:GITHUB_WORKSPACE/tools/GameNet98-CS2-LAN-source-v040.part04-s02.txt",
            "$env:GITHUB_WORKSPACE/tools/GameNet98-CS2-LAN-source-v040.part04-s03.txt",
            "$env:GITHUB_WORKSPACE/tools/GameNet98-CS2-LAN-source-v040.part04-s04.txt",
            "$env:GITHUB_WORKSPACE/tools/GameNet98-CS2-LAN-source-v040.part04-s05.txt",
            "$env:GITHUB_WORKSPACE/tools/GameNet98-CS2-LAN-source-v040.part04-s06.txt",
            "$env:GITHUB_WORKSPACE/tools/GameNet98-CS2-LAN-source-v040.part04-s07.txt",
            "$env:GITHUB_WORKSPACE/tools/GameNet98-CS2-LAN-source-v040.part04-s08-a.txt",
            "$env:GITHUB_WORKSPACE/tools/GameNet98-CS2-LAN-source-v040.part04-s08-b.txt",
            "$env:GITHUB_WORKSPACE/tools/GameNet98-CS2-LAN-source-v040.part04-s08-c1.txt",
            "$env:GITHUB_WORKSPACE/tools/GameNet98-CS2-LAN-source-v040.part04-s08-c2.txt",
            "$env:GITHUB_WORKSPACE/tools/GameNet98-CS2-LAN-source-v040.part04-s08-d.txt",
            "$env:GITHUB_WORKSPACE/tools/GameNet98-CS2-LAN-source-v040.part04-s08-e.txt",
            "$env:GITHUB_WORKSPACE/tools/GameNet98-CS2-LAN-source-v040.part05.txt",
            "$env:GITHUB_WORKSPACE/tools/GameNet98-CS2-LAN-source-v040.part06.txt",
            "$env:GITHUB_WORKSPACE/tools/GameNet98-CS2-LAN-source-v040.part07.txt",
            "$env:GITHUB_WORKSPACE/tools/GameNet98-CS2-LAN-source-v040.part08.txt"
          )
          $encoded = [System.Text.StringBuilder]::new()
          foreach ($part in $partPaths) {
            if (!(Test-Path $part)) { throw "Missing source part: $part" }
            [void]$encoded.Append(([System.IO.File]::ReadAllText($part)).Trim())
          }
          $zipPath = "$env:RUNNER_TEMP/GameNet98-CS2-LAN-v040-source.zip"
          [System.IO.File]::WriteAllBytes($zipPath, [Convert]::FromBase64String($encoded.ToString()))
          Write-Host "Reassembled archive size: $((Get-Item -LiteralPath $zipPath).Length) bytes"
          Expand-Archive -LiteralPath $zipPath -DestinationPath "$env:RUNNER_TEMP/GameNet98-v040-src" -Force
          $sourceDir = Join-Path "$env:RUNNER_TEMP/GameNet98-v040-src" 'GameNet98-CS2-LAN'
          if (!(Test-Path (Join-Path $sourceDir 'gamenet98_lan.pyw'))) { throw 'v0.4 source application missing from archive.' }
          "SOURCE_DIR=$sourceDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Make path-alias test Windows-safe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $testFile = Join-Path "$env:SOURCE_DIR" 'tests\test_core.py'
          $testText = [System.IO.File]::ReadAllText($testFile)
          $old = 'self.assertEqual(game_install_root(source_exe), source_root)'
          $new = 'self.assertTrue(game_install_root(source_exe).samefile(source_root))'
          if (!$testText.Contains($old)) { throw 'Expected path assertion not found; do not continue with an unpatched test.' }
          $testText = $testText.Replace($old, $new)
          [System.IO.File]::WriteAllText($testFile, $testText, [System.Text.UTF8Encoding]::new($false))

      - name: Syntax check
        shell: pwsh
        run: |
          python -m py_compile "$env:SOURCE_DIR/gamenet98_core.py" "$env:SOURCE_DIR/gamenet98_lan.pyw"

      - name: Unit tests
        shell: pwsh
        run: |
          Push-Location "$env:SOURCE_DIR"
          python -m unittest discover -s tests -v
          Pop-Location

      - name: Build standalone Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pyinstaller
          Push-Location "$env:SOURCE_DIR"
          python -m PyInstaller --clean --noconfirm --onefile --windowed --icon GameNet98.ico --name GameNet98-LAN-Offline gamenet98_lan.pyw
          Pop-Location
          if (!(Test-Path "$env:SOURCE_DIR/dist/GameNet98-LAN-Offline.exe")) { throw 'Application EXE was not created.' }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }

      - name: Build Setup installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler not found at $compiler" }
          & $compiler "$env:SOURCE_DIR/GameNet98-CS2-LAN-Offline.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (!(Test-Path "$env:SOURCE_DIR/dist/installer/GameNet98-CS2-LAN-Setup.exe")) { throw 'Setup installer missing.' }

      - name: Package installer and portable app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "$env:GITHUB_WORKSPACE/out/GameNet98-CS2-LAN-v040"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$env:SOURCE_DIR/dist/GameNet98-LAN-Offline.exe" "$out/"
          Copy-Item "$env:SOURCE_DIR/dist/installer/GameNet98-CS2-LAN-Setup.exe" "$out/"
          Copy-Item "$env:SOURCE_DIR/README_FA.md", "$env:SOURCE_DIR/README.md" "$out/"
          Compress-Archive -Path "$out/*" -DestinationPath "$env:GITHUB_WORKSPACE/out/GameNet98-CS2-LAN-v040-Windows-x64.zip" -Force

      - name: Upload v0.4 test package
        uses: actions/upload-artifact@v4
        with:
          name: GameNet98-CS2-LAN-v040-Windows-x64
          path: |
            out/GameNet98-CS2-LAN-v040-Windows-x64.zip
            out/GameNet98-CS2-LAN-v040/GameNet98-CS2-LAN-Setup.exe
            out/GameNet98-CS2-LAN-v040/GameNet98-LAN-Offline.exe
          if-no-files-found: error
          retention-days: 30
