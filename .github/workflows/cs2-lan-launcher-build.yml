name: Build GameNet 98 CS2 LAN Launcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/GameNet98-CS2-LAN-source.zip.b64'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Decode and extract source package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $encoded = [System.IO.File]::ReadAllText("$env:GITHUB_WORKSPACE/tools/GameNet98-CS2-LAN-source.zip.b64").Trim()
          $zipPath = "$env:RUNNER_TEMP/GameNet98-CS2-LAN-source.zip"
          [System.IO.File]::WriteAllBytes($zipPath, [Convert]::FromBase64String($encoded))
          Expand-Archive -LiteralPath $zipPath -DestinationPath "$env:RUNNER_TEMP/GameNet98-src" -Force
          $sourceDir = Join-Path "$env:RUNNER_TEMP/GameNet98-src" 'GameNet98-CS2-LAN'
          if (!(Test-Path (Join-Path $sourceDir 'gamenet98_lan.pyw'))) { throw 'Source application was not found in the archive.' }
          "SOURCE_DIR=$sourceDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Syntax check
        shell: pwsh
        run: |
          python -m py_compile "$env:SOURCE_DIR/gamenet98_core.py" "$env:SOURCE_DIR/gamenet98_lan.pyw"
      - name: Unit tests
        shell: pwsh
        run: |
          python -m unittest discover -s "$env:SOURCE_DIR/tests" -v
      - name: Build self-contained Windows GUI EXE
        shell: pwsh
        run: |
          python -m pip install --upgrade pyinstaller
          Push-Location "$env:SOURCE_DIR"
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name GameNet98-LAN gamenet98_lan.pyw
          Pop-Location
          if (!(Test-Path "$env:SOURCE_DIR/dist/GameNet98-LAN.exe")) { throw 'EXE build output was not created.' }
      - name: Package EXE and instructions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/out/GameNet98-LAN" | Out-Null
          Copy-Item "$env:SOURCE_DIR/dist/GameNet98-LAN.exe" "$env:GITHUB_WORKSPACE/out/GameNet98-LAN/"
          Copy-Item "$env:SOURCE_DIR/README_FA.md", "$env:SOURCE_DIR/README.md" "$env:GITHUB_WORKSPACE/out/GameNet98-LAN/"
          Compress-Archive -Path "$env:GITHUB_WORKSPACE/out/GameNet98-LAN/*" -DestinationPath "$env:GITHUB_WORKSPACE/out/GameNet98-LAN-Windows-x64.zip" -Force
      - name: Upload Windows test package
        uses: actions/upload-artifact@v4
        with:
          name: GameNet98-LAN-Windows-x64
          path: out/GameNet98-LAN-Windows-x64.zip
          if-no-files-found: error
          retention-days: 30
