name: Build GameNet 98 Offline CS2 LAN Launcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/GameNet98-CS2-LAN-source.part*.txt'
      - 'tools/GameNet98-CS2-LAN-source.ready'
      - '.github/workflows/cs2-lan-launcher-build.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reassemble and extract source archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = @(
            "$env:GITHUB_WORKSPACE/tools/GameNet98-CS2-LAN-source.part1.txt",
            "$env:GITHUB_WORKSPACE/tools/GameNet98-CS2-LAN-source.part2.txt",
            "$env:GITHUB_WORKSPACE/tools/GameNet98-CS2-LAN-source.part3.txt",
            "$env:GITHUB_WORKSPACE/tools/GameNet98-CS2-LAN-source.part4.txt"
          )
          $encoded = [System.Text.StringBuilder]::new()
          foreach ($part in $parts) {
            if (!(Test-Path $part)) { throw "Missing source part: $part" }
            [void]$encoded.Append(([System.IO.File]::ReadAllText($part)).Trim())
          }
          $zipPath = "$env:RUNNER_TEMP/GameNet98-CS2-LAN-source.zip"
          [System.IO.File]::WriteAllBytes($zipPath, [Convert]::FromBase64String($encoded.ToString()))
          Expand-Archive -LiteralPath $zipPath -DestinationPath "$env:RUNNER_TEMP/GameNet98-src" -Force
          $sourceDir = Join-Path "$env:RUNNER_TEMP/GameNet98-src" 'GameNet98-CS2-LAN'
          if (!(Test-Path (Join-Path $sourceDir 'gamenet98_lan.pyw'))) { throw 'Source application was not found in the archive.' }
          "SOURCE_DIR=$sourceDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Syntax check
        shell: pwsh
        run: |
          python -m py_compile "$env:SOURCE_DIR/gamenet98_core.py" "$env:SOURCE_DIR/gamenet98_lan.pyw"

      - name: Unit tests
        shell: pwsh
        run: |
          Push-Location "$env:SOURCE_DIR"
          python -m unittest discover -s tests -v
          Pop-Location

      - name: Build standalone Windows GUI application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pyinstaller
          Push-Location "$env:SOURCE_DIR"
          python -m PyInstaller --clean --noconfirm --onefile --windowed --name GameNet98-LAN-Offline gamenet98_lan.pyw
          Pop-Location
          if (!(Test-Path "$env:SOURCE_DIR/dist/GameNet98-LAN-Offline.exe")) { throw 'Application EXE was not created.' }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }

      - name: Build Windows Setup installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $compiler)) { throw "Inno Setup compiler not found at $compiler" }
          & $compiler "$env:SOURCE_DIR/GameNet98-CS2-LAN-Offline.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (!(Test-Path "$env:SOURCE_DIR/dist/installer/GameNet98-CS2-LAN-Setup.exe")) { throw 'Setup installer was not created.' }

      - name: Package test downloads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $out = "$env:GITHUB_WORKSPACE/out/GameNet98-CS2-LAN-Offline"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$env:SOURCE_DIR/dist/GameNet98-LAN-Offline.exe" "$out/"
          Copy-Item "$env:SOURCE_DIR/dist/installer/GameNet98-CS2-LAN-Setup.exe" "$out/"
          Copy-Item "$env:SOURCE_DIR/README_FA.md", "$env:SOURCE_DIR/README.md" "$out/"
          Compress-Archive -Path "$out/*" -DestinationPath "$env:GITHUB_WORKSPACE/out/GameNet98-CS2-LAN-Offline-Windows-x64.zip" -Force

      - name: Upload Windows installer and app
        uses: actions/upload-artifact@v4
        with:
          name: GameNet98-CS2-LAN-Offline-Windows-x64
          path: |
            out/GameNet98-CS2-LAN-Offline-Windows-x64.zip
            out/GameNet98-CS2-LAN-Offline/GameNet98-CS2-LAN-Setup.exe
            out/GameNet98-CS2-LAN-Offline/GameNet98-LAN-Offline.exe
          if-no-files-found: error
          retention-days: 30
