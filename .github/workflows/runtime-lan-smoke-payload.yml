name: Runtime LAN Smoke Payload

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "foundation/runtime-*"
      - "integration/runtime-operator-v1"
    paths:
      - ".github/workflows/runtime-lan-smoke-payload.yml"
      - "GameNet.slnx"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "src/Server/**"
      - "src/Client/**"
      - "src/Desktop/**"
      - "src/Shared/**"
      - "scripts/configure-server-tls.ps1"
      - "scripts/trust-server-certificate.ps1"
      - "scripts/configure-runtime-endpoint.ps1"
      - "scripts/configure-agent-runtime-state.ps1"
      - "scripts/provision-agent-enrollment.ps1"
      - "docs/operations/agent-service-state.md"
      - "scripts/test-runtime-endpoint.ps1"
      - "scripts/modules/ServerTlsCertificate.psm1"
      - "docs/operations/runtime-endpoints.md"

permissions:
  contents: read

concurrency:
  group: runtime-lan-smoke-payload-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-payload:
    name: Build portable runtime payload (not Setup)
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    env:
      GAMENET_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
      GAMENET_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify pinned .NET SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $actual = (dotnet --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne "10.0.401") {
            throw "Expected pinned .NET SDK 10.0.401; found '$actual'. Use the repository's installed SDK rather than attempting a system install."
          }

      - name: Restore Windows x64 runtime graph
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore GameNet.slnx --runtime win-x64
          if ($LASTEXITCODE -ne 0) { throw "Windows x64 restore failed." }

      - name: Publish Server, Agent, and Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-StrictMode -Version Latest

          $payloadRoot = Join-Path $env:RUNNER_TEMP ("gamenet5-runtime-lan-" + $env:GITHUB_RUN_ID)
          $distRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/runtime-lan-smoke"
          if (Test-Path -LiteralPath $payloadRoot) {
            Remove-Item -LiteralPath $payloadRoot -Recurse -Force
          }
          if (Test-Path -LiteralPath $distRoot) {
            Remove-Item -LiteralPath $distRoot -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $payloadRoot, $distRoot | Out-Null

          $dotnet = (Get-Command dotnet -ErrorAction Stop).Source
          function Invoke-DotNet {
            param([Parameter(Mandatory = $true)][string[]]$Arguments)
            & $dotnet @Arguments
            if ($LASTEXITCODE -ne 0) {
              throw "dotnet command failed (exit=$LASTEXITCODE): $($Arguments -join ' ')"
            }
          }

          $serverOutput = Join-Path $payloadRoot "Server"
          $agentOutput = Join-Path $payloadRoot "Agent"
          $desktopOutput = Join-Path $payloadRoot "Desktop"
          $toolsOutput = Join-Path $payloadRoot "Tools"
          $modulesOutput = Join-Path $toolsOutput "modules"
          New-Item -ItemType Directory -Force -Path $serverOutput, $agentOutput, $desktopOutput, $modulesOutput | Out-Null

          Invoke-DotNet @(
            "publish", "src/Server/GameNet.Server.csproj",
            "--configuration", "Release", "--runtime", "win-x64",
            "--self-contained", "true", "--no-restore",
            "-p:PublishSingleFile=false",
            "--output", $serverOutput
          )
          Invoke-DotNet @(
            "publish", "src/Client/GameNet.Agent.csproj",
            "--configuration", "Release", "--runtime", "win-x64",
            "--self-contained", "true", "--no-restore",
            "-p:PublishSingleFile=false",
            "--output", $agentOutput
          )
          Invoke-DotNet @(
            "publish", "src/Desktop/GameNet.Desktop.csproj",
            "--configuration", "Release", "--runtime", "win-x64",
            "--self-contained", "true", "--no-restore",
            "-p:PublishSingleFile=false",
            "--output", $desktopOutput
          )

          # The migration bundle is an explicit, separate operation. It does not
          # connect to or mutate any database during package creation.
          Invoke-DotNet @("tool", "restore")
          $migrationBundle = Join-Path $toolsOutput "GameNet.Migrations.exe"
          Invoke-DotNet @(
            "ef", "migrations", "bundle",
            "--project", "src/Server/GameNet.Server.csproj",
            "--startup-project", "src/Server/GameNet.Server.csproj",
            "--context", "GameNet.Server.Persistence.GameNetDbContext",
            "--configuration", "Release",
            "--self-contained", "--target-runtime", "win-x64",
            "--output", $migrationBundle
          )

          Copy-Item -LiteralPath "scripts/configure-server-tls.ps1" -Destination $toolsOutput
          Copy-Item -LiteralPath "scripts/trust-server-certificate.ps1" -Destination $toolsOutput
          Copy-Item -LiteralPath "scripts/configure-runtime-endpoint.ps1" -Destination $toolsOutput
          Copy-Item -LiteralPath "scripts/configure-agent-runtime-state.ps1" -Destination $toolsOutput
          Copy-Item -LiteralPath "scripts/provision-agent-enrollment.ps1" -Destination $toolsOutput
          Copy-Item -LiteralPath "docs/operations/agent-service-state.md" -Destination (Join-Path $toolsOutput "agent-service-state.md")
          Copy-Item -LiteralPath "scripts/test-runtime-endpoint.ps1" -Destination $toolsOutput
          Copy-Item -LiteralPath "scripts/modules/ServerTlsCertificate.psm1" -Destination $modulesOutput
          Copy-Item -LiteralPath "docs/operations/runtime-endpoints.md" -Destination (Join-Path $toolsOutput "runtime-endpoints.md")

          $requiredFiles = @(
            (Join-Path $serverOutput "GameNet.Server.exe"),
            (Join-Path $agentOutput "GameNet.Agent.exe"),
            (Join-Path $desktopOutput "GameNet.Manager.Desktop.exe"),
            $migrationBundle,
            (Join-Path $toolsOutput "configure-agent-runtime-state.ps1"),
            (Join-Path $toolsOutput "provision-agent-enrollment.ps1"),
            (Join-Path $toolsOutput "agent-service-state.md")
          )
          foreach ($file in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Required payload file is missing: $file"
            }
          }

          $readme = @'
          # GameNet 5 — temporary Runtime LAN Smoke payload

          **This is NOT Setup and is NOT a production release.** It is a portable, self-contained Windows x64 payload built from one exact candidate checkout. It does not register Windows services, install PostgreSQL, create production secrets, or enable update/repair/rollback.

          ## Included

          - `Server\GameNet.Server.exe`
          - `Agent\GameNet.Agent.exe`
          - `Desktop\GameNet.Manager.Desktop.exe`
          - `Tools\GameNet.Migrations.exe` — an explicit EF migration bundle
          - TLS and endpoint configuration/check scripts under `Tools\`
          - `Tools\configure-agent-runtime-state.ps1`, `Tools\provision-agent-enrollment.ps1`, and the Agent Windows Service state/DACL runbook
          - `manifest.json` with source identity and SHA-256 hashes for packaged files

          ## Safety boundary

          Use only on isolated test machines and a **new, disposable PostgreSQL database**. Never point this payload or its migration bundle at the live GameNet/business database. Use throwaway test credentials and secrets only. Do not put passwords, provisioning keys or signing keys in `server.json`, source control, or logs. The migration command's connection argument may be visible to local process-inspection tools, so only a throwaway database account is acceptable.

          The package does not include business data, database backups, production credentials, server signing keys, Agent provisioning secrets, or a private TLS key. The Server TLS script creates a local machine certificate and exports only its public certificate. Execute it only on an isolated test Server PC after checking the target IP and service account.

          ## Intended bounded smoke sequence

          1. Verify the downloaded ZIP against the adjacent `SHA256SUMS.txt` file before extraction.
          2. Extract the package into a temporary folder on the isolated test PCs. Keep the package's recorded `manifest.json` with the test notes.
          3. Provision a disposable PostgreSQL database for this candidate. Apply schema changes only by explicitly running `Tools\GameNet.Migrations.exe --connection "<DISPOSABLE_TEST_DATABASE_CONNECTION>"`. Do not run this against any existing business database.
          4. On the isolated Server PC, run elevated PowerShell from the extracted package root and follow `Tools\runtime-endpoints.md` to configure HTTPS. Record the Server IP/SAN and independently verify the printed 64-character public-certificate SHA-256 fingerprint. Copy only the public `.cer` file to client PCs.
          5. On each isolated client PC, verify and trust the public certificate with `Tools\trust-server-certificate.ps1`; then configure its endpoint with `Tools\configure-runtime-endpoint.ps1`. Use the matching certificate SAN host/IP.
          6. Run `Tools\test-runtime-endpoint.ps1 -Component Desktop` on the Desktop PC and `-Component Agent` on the Agent PC. Both checks use normal Windows TLS validation and require Server readiness to report `Ready`.
          7. Record what was tested and what was not. A successful health request alone does **not** prove Agent enrollment, an authoritative lease, heartbeat/reconciliation, restart/reconnect, or private-key access under the real Windows service identity.

          For an Agent Windows-service test, first register the service explicitly on the disposable Agent PC with the LocalService logon identity and leave it stopped. Follow `Tools\agent-service-state.md`, then run `Tools\configure-agent-runtime-state.ps1` elevated. Before starting the service, run `Tools\provision-agent-enrollment.ps1 -DeviceId "station-pc-01"` elevated on that same Agent PC. It securely prompts an authorized operator, issues a one-time token over HTTPS, stores it in the DPAPI-protected `Agent\enrollment-token.dpapi` file with a service-restricted DACL, and prints no token value. The Agent service then redeems that file at first start. Neither helper installs/registers the service.

          ## Explicit limitations

          This payload is only the prerequisite build artifact. It does not yet provide a supported protected secret store or service-install flow. Do not install it on the live GameNet PCs or claim the LAN gate passed from CI alone. Before any service-based runtime test, the service identity and a safe, isolated way to provide throwaway test settings must be agreed and verified. Final Setup, service registration, repair, update, rollback and release certification remain later stages.
          '@
          $readmePath = Join-Path $payloadRoot "LAN-SMOKE-README.md"
          [System.IO.File]::WriteAllText($readmePath, $readme.Replace("`r`n", "`n"), [System.Text.UTF8Encoding]::new($false))

          $checkoutSha = ((& git rev-parse HEAD) -join "").Trim()
          if ($LASTEXITCODE -ne 0 -or $checkoutSha -notmatch '^[0-9a-f]{40}$') {
            throw "Could not determine the exact tested checkout SHA."
          }

          $payloadFiles = @(
            Get-ChildItem -LiteralPath $payloadRoot -Recurse -File |
              Where-Object { $_.Name -ne "manifest.json" } |
              Sort-Object FullName |
              ForEach-Object {
                $relative = [System.IO.Path]::GetRelativePath($payloadRoot, $_.FullName).Replace("`\", "/")
                [pscustomobject][ordered]@{
                  component = ($relative.Split("/")[0])
                  path = $relative
                  sizeBytes = $_.Length
                  sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
                }
              }
          )
          $manifest = [ordered]@{
            formatVersion = 1
            product = "GameNet 5"
            artifactType = "temporary-runtime-lan-smoke-payload"
            isInstaller = $false
            productionCertified = $false
            databaseIncluded = $false
            credentialsIncluded = $false
            target = [ordered]@{
              operatingSystem = "Windows"
              architecture = "x64"
              runtimeIdentifier = "win-x64"
              configuration = "Release"
              selfContained = $true
            }
            source = [ordered]@{
              testedCheckoutSha = $checkoutSha
              githubSha = $env:GITHUB_SHA
              pullRequestHeadSha = $env:GAMENET_PR_HEAD_SHA
              pullRequestBaseSha = $env:GAMENET_PR_BASE_SHA
              refName = $env:GITHUB_REF_NAME
            }
            builtAtUtc = [DateTime]::UtcNow.ToString("O")
            files = $payloadFiles
          }
          $manifestPath = Join-Path $payloadRoot "manifest.json"
          [System.IO.File]::WriteAllText(
            $manifestPath,
            ($manifest | ConvertTo-Json -Depth 12) + [Environment]::NewLine,
            [System.Text.UTF8Encoding]::new($false)
          )

          $shortSha = $checkoutSha.Substring(0, 12)
          $packageName = "GameNet5-RuntimeLanSmoke-$shortSha.zip"
          $packagePath = Join-Path $distRoot $packageName
          Compress-Archive -Path (Join-Path $payloadRoot "*") -DestinationPath $packagePath -CompressionLevel Optimal
          $packageHash = (Get-FileHash -LiteralPath $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
          $sumPath = Join-Path $distRoot "SHA256SUMS.txt"
          [System.IO.File]::WriteAllText(
            $sumPath,
            "$packageHash  $packageName" + [Environment]::NewLine,
            [System.Text.UTF8Encoding]::new($false)
          )

          Write-Host "RUNTIME_LAN_PAYLOAD_READY=true"
          Write-Host "TESTED_CHECKOUT_SHA=$checkoutSha"
          Write-Host "PACKAGE_NAME=$packageName"
          Write-Host "PACKAGE_SHA256=$packageHash"
          Write-Host "PACKAGE_IS_SETUP=false"
          Write-Host "PACKAGE_INCLUDES_SECRETS=false"

      - name: Upload temporary payload and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: runtime-lan-smoke-payload-${{ github.run_id }}
          path: |
            artifacts/runtime-lan-smoke/*.zip
            artifacts/runtime-lan-smoke/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
