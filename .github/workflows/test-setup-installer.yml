name: Slice 1 Test Setup Installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "integration/runtime-operator-v1"
      - "integration/runtime-*"
      - "fix/**"
      - "feature/**"
    paths:
      - ".github/workflows/test-setup-installer.yml"
      - "installer/Slice1-TestSetup.iss"
      - "scripts/build-slice1-test-setup.ps1"
      - "scripts/run-slice1-process-acceptance.ps1"
      - "tools/TestLauncher/**"
      - "GameNet.slnx"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "src/Server/**"
      - "src/Client/**"
      - "src/Desktop/**"
      - "src/Shared/**"
      - "docs/operations/slice1-process-acceptance.md"
      - "docs/operations/manual-cash-sale-reversal-acceptance.md"
      - "docs/operations/manual-session-timing-recovery-acceptance.md"

permissions:
  contents: read

concurrency:
  group: slice1-test-setup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-setup:
    name: Build and smoke-test Windows Setup.exe
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      GAMENET_EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Enforce repository runner policy
        shell: pwsh
        run: .\scripts\check-ci-runner-policy.ps1

      - name: Install repository-pinned .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Verify exact tested source SHA
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $actual = ((& git rev-parse HEAD) -join "").Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -notmatch '^[0-9a-f]{40}$' -or $actual -ne $env:GAMENET_EXPECTED_SOURCE_SHA) {
            throw "Test Setup checkout does not match the expected exact candidate SHA."
          }
          Write-Host "TEST_SETUP_EXACT_SOURCE_SHA=$actual"

      - name: Restore pinned Windows x64 build graph
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet restore GameNet.slnx --runtime win-x64
          if ($LASTEXITCODE -ne 0) { throw "GameNet Windows x64 restore failed." }

      - name: Parse internal PowerShell sources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = @()
          $files += Get-ChildItem .\scripts -Recurse -File -Filter "*.ps1"
          $files += Get-ChildItem .\scripts -Recurse -File -Filter "*.psm1"
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | Format-List ErrorId, Message, Extent
              throw "PowerShell syntax error in $($file.FullName)."
            }
          }
          Write-Host "TEST_SETUP_POWERSHELL_PARSE=PASS"

      - name: Download and verify pinned Inno Setup installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installerUrl = "https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe"
          $expectedSha256 = "f3c42116542c4cc57263c5ba6c4feabfc49fe771f2f98a79d2f7628b8762723b"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.4.3.exe"
          Invoke-WebRequest -Uri $installerUrl -OutFile $installer
          $actualSha256 = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "Downloaded Inno Setup 6.4.3 installer SHA-256 did not match the immutable upstream release asset."
          }
          $signature = Get-AuthenticodeSignature -FilePath $installer
          if ($signature.Status -ne "Valid" -or
              $null -eq $signature.SignerCertificate -or
              $signature.SignerCertificate.Subject -notmatch "Pyrsys B\.V\.") {
            throw "Inno Setup installer Authenticode signature is not valid or publisher is unexpected."
          }
          Write-Host "INNO_SETUP_INSTALLER_SHA256=$actualSha256"
          Write-Host "INNO_SETUP_AUTHENTICODE=PASS"

      - name: Install pinned Inno Setup compiler in isolated temporary folder
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-6.4.3.exe"
          $compilerRoot = Join-Path $env:RUNNER_TEMP "innosetup-6.4.3"
          if (Test-Path -LiteralPath $compilerRoot) {
            throw "Pinned compiler staging directory already exists; refusing to reuse it."
          }
          New-Item -ItemType Directory -Path $compilerRoot | Out-Null
          $installLog = Join-Path $env:RUNNER_TEMP "innosetup-6.4.3-install.log"
          $arguments = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=`"$compilerRoot`"",
            "/LOG=`"$installLog`""
          )
          $process = Start-Process -FilePath $installer -ArgumentList $arguments -Wait -PassThru
          $exitCode = $process.ExitCode
          $process.Dispose()
          if ($exitCode -ne 0) {
            if (Test-Path -LiteralPath $installLog) {
              Get-Content -LiteralPath $installLog -Tail 100 | ForEach-Object { Write-Host $_ }
            }
            throw "Pinned Inno Setup 6.4.3 temporary installation failed (exit code $exitCode)."
          }
          $iscc = Join-Path $compilerRoot "ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc -PathType Leaf)) {
            throw "Pinned Inno Setup compiler is missing after temporary installation."
          }
          Write-Host "INNO_SETUP_COMPILER=$iscc"
          Write-Host "Compiler engine version will be asserted by the version-probe build script."
      - name: Build Setup.exe and verify source/hash manifests
        shell: pwsh
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = "Stop"
          $version = "0.1.0-test.${{ github.run_number }}.${{ github.run_attempt }}"
          $iscc = Join-Path $env:RUNNER_TEMP "innosetup-6.4.3\ISCC.exe"
          .\scripts\build-slice1-test-setup.ps1 -Version $version -OutputDirectory "artifacts/test-setup/out" -InnoSetupCompilerPath $iscc

          $actual = ((& git rev-parse HEAD) -join "").Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:GAMENET_EXPECTED_SOURCE_SHA) {
            throw "Git checkout changed while building the test installer."
          }
          $out = ".\artifacts\test-setup\out"
          $setupManifest = Get-Content (Join-Path $out "setup-manifest.json") -Raw | ConvertFrom-Json
          if ($setupManifest.source.testedCheckoutSha -ne $actual -or
              $setupManifest.safety.productionRelease -ne $false -or
              $setupManifest.safety.registersWindowsServices -ne $false -or
              $setupManifest.safety.changesMachineProgramData -ne $false) {
            throw "The Setup manifest does not match the tested SHA or violates the test-only safety boundary."
          }
          foreach ($line in Get-Content (Join-Path $out "SHA256SUMS.txt")) {
            if ($line -notmatch '^(?<hash>[0-9a-fA-F]{64})  (?<path>.+)$') {
              throw "Invalid SHA256SUMS.txt entry."
            }
            $expected = $Matches.hash.ToLowerInvariant()
            $relative = $Matches.path.Replace('/', [string][char]92)
            $actualHash = (Get-FileHash -LiteralPath (Join-Path $out $relative) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expected) {
              throw "Setup artifact SHA-256 mismatch: $relative"
            }
          }
          $actualSetupHash = (Get-FileHash -LiteralPath (Join-Path $out "GameNet5-TestSetup.exe") -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($setupManifest.installer.sha256 -ne $actualSetupHash) {
            throw "Setup.exe hash differs from the external installer manifest."
          }
          Write-Host "TEST_SETUP_PACKAGE_HASHES=PASS"
          Write-Host "SETUP_EXE_SHA256=$($setupManifest.installer.sha256)"

      - name: Smoke-test install, Desktop shortcut, launcher, and uninstall
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Resolve-Path ".\artifacts\test-setup\out\GameNet5-TestSetup.exe").Path
          $smokeRoot = Join-Path $env:RUNNER_TEMP ("gamenet5-test-setup-smoke-" + [Guid]::NewGuid().ToString("N"))
          $desktop = [Environment]::GetFolderPath([Environment+SpecialFolder]::DesktopDirectory)
          $shortcut = Join-Path $desktop "GameNet 5 Test Launcher.lnk"
          $beforeServices = @(Get-CimInstance Win32_Service | Where-Object { $_.Name -in @("GameNet 5 Server", "GameNet 5 Agent") } | ForEach-Object Name)

          $installerLog = Join-Path $env:RUNNER_TEMP "gamenet5-test-setup-install.log"
          $installArguments = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/DIR=`"$smokeRoot`"",
            "/LOG=`"$installerLog`""
          )
          $installProcess = Start-Process -FilePath $setup -ArgumentList $installArguments -Wait -PassThru
          $installerExitCode = $installProcess.ExitCode
          $installProcess.Dispose()
          if ($installerExitCode -ne 0) {
            Write-Host "TEST_SETUP_INSTALLER_EXIT_CODE=$installerExitCode"
            if (Test-Path -LiteralPath $installerLog) {
              Get-Content -LiteralPath $installerLog -Tail 120 | ForEach-Object { Write-Host $_ }
            }
            throw "Silent test Setup smoke installation failed (exit code $installerExitCode)."
          }

          foreach ($relative in @(
            "Launcher\GameNet5.TestLauncher.exe",
            "Setup\PowerShell\pwsh.exe",
            "Server\GameNet.Server.exe",
            "Agent\GameNet.Agent.exe",
            "Desktop\GameNet.Manager.Desktop.exe",
            "Tools\run-slice1-process-acceptance.ps1",
            "manifest.json"
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $smokeRoot $relative) -PathType Leaf)) {
              throw "Installed Setup is missing required file: $relative"
            }
          }
          if (-not (Test-Path -LiteralPath $shortcut -PathType Leaf)) {
            throw "The installer did not create the expected Desktop shortcut."
          }
          $launcherExe = Join-Path $smokeRoot "Launcher\GameNet5.TestLauncher.exe"
          $launcherStdout = Join-Path $env:RUNNER_TEMP "gamenet5-test-launcher-self-test.out"
          $launcherStderr = Join-Path $env:RUNNER_TEMP "gamenet5-test-launcher-self-test.err"
          $launcherProcess = Start-Process -FilePath $launcherExe -ArgumentList @("--self-test") -Wait -PassThru -NoNewWindow -RedirectStandardOutput $launcherStdout -RedirectStandardError $launcherStderr
          $launcherExitCode = $launcherProcess.ExitCode
          $launcherProcess.Dispose()
          $launcherOutputText = if (Test-Path -LiteralPath $launcherStdout) { Get-Content -LiteralPath $launcherStdout -Raw } else { "" }
          $launcherErrorText = if (Test-Path -LiteralPath $launcherStderr) { Get-Content -LiteralPath $launcherStderr -Raw } else { "" }
          Write-Host $launcherOutputText
          if ($launcherExitCode -ne 0 -or
              $launcherOutputText -notmatch "TEST_LAUNCHER_DPAPI_SELF_TEST=PASS" -or
              $launcherErrorText -match "TEST_LAUNCHER_DPAPI_SELF_TEST=FAIL") {
            Write-Host "TEST_LAUNCHER_SELF_TEST_EXIT_CODE=$launcherExitCode"
            if (-not [string]::IsNullOrWhiteSpace($launcherErrorText)) { Write-Host $launcherErrorText }
            throw "Installed Test Launcher failed its DPAPI settings self-test."
          }

          $afterServices = @(Get-CimInstance Win32_Service | Where-Object { $_.Name -in @("GameNet 5 Server", "GameNet 5 Agent") } | ForEach-Object Name)
          if (@($afterServices | Where-Object { $_ -notin $beforeServices }).Count -gt 0) {
            throw "The process-only test installer unexpectedly registered a Windows service."
          }

          $uninstaller = Join-Path $smokeRoot "unins000.exe"
          $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru -NoNewWindow
          $uninstallExitCode = $uninstallProcess.ExitCode
          $uninstallProcess.Dispose()
          if ($uninstallExitCode -ne 0) { throw "Silent test Setup smoke uninstall failed (exit code $uninstallExitCode)." }
          if (Test-Path -LiteralPath $shortcut) {
            throw "The uninstaller left the test Desktop shortcut behind."
          }
          Write-Host "TEST_SETUP_INSTALL_SHORTCUT_LAUNCHER_UNINSTALL=PASS"

      - name: Upload exact-SHA test Setup and verification data
        uses: actions/upload-artifact@v4
        with:
          name: gamenet5-slice1-test-setup-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/test-setup/out/GameNet5-TestSetup.exe
            artifacts/test-setup/out/setup-manifest.json
            artifacts/test-setup/out/manifest.json
            artifacts/test-setup/out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
