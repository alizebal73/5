name: gamenet-verification

on:
  workflow_dispatch:
  pull_request:
    branches-ignore:
      - "foundation/runtime-*"

concurrency:
  group: gamenet-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name != 'pull_request' || !startsWith(github.head_ref, 'foundation/runtime-') }}
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PowerShell parser gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($file in Get-ChildItem .\scripts -Recurse -File -Filter *.ps1) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw "PowerShell syntax error in $($file.FullName)."
            }
          }

      - name: Canonical verification
        shell: pwsh
        run: .\scripts\verify.ps1
