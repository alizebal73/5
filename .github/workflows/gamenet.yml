name: gamenet-quick-validation

on:
  workflow_dispatch:
  # Fast lane for normal development commits; skip Markdown-only pushes.
  push:
    branches:
      - "feature/operator-identity-v1"
    paths-ignore:
      - "**/*.md"
  # Always run on PRs to main so a future required status check cannot be skipped by path filters.
  # Foundation-targeted PRs are handled by the full certification workflow.
  pull_request:
    branches:
      - main

concurrency:
  group: gamenet-quick-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-validation:
    name: quick-validation
    timeout-minutes: 20
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PowerShell parser gate
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($file in Get-ChildItem .\scripts -Recurse -File -Filter *.ps1) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw "PowerShell syntax error in $($file.FullName)."
            }
          }

      - name: Canonical build and tests
        timeout-minutes: 15
        shell: pwsh
        run: .\scripts\verify.ps1

  deployment-payload:
    name: deployment-payload
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build-deployment-payload]')
    needs: quick-validation
    timeout-minutes: 35
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout exact verified commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish versioned self-contained payloads
        shell: pwsh
        run: |
          $version = "0.1.0-preview.${{ github.run_number }}.${{ github.run_attempt }}"
          .\scripts\publish-deployment-payloads.ps1 -Version $version

      - name: Upload payload archives and checksums
        uses: actions/upload-artifact@v4
        with:
          name: gamenet-deployment-payload-${{ github.sha }}
          path: |
            artifacts/deployment/**/*.zip
            artifacts/deployment/**/release-manifest.json
            artifacts/deployment/**/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
