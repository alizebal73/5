name: gamenet-quick-validation

on:
  workflow_dispatch:
  # Low-noise fast lane for active feature/fix branches; Markdown-only pushes skip CI.
  push:
    branches:
      - "feature/**"
      - "fix/**"
    paths-ignore:
      - "**/*.md"
  # Required check for changes proposed to main.
  pull_request:
    branches:
      - main

concurrency:
  group: gamenet-quick-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quick-validation:
    name: quick-validation
    timeout-minutes: 20
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PowerShell parser gate
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($file in Get-ChildItem .\scripts -Recurse -File -Filter *.ps1) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw "PowerShell syntax error in $($file.FullName)."
            }
          }

      - name: Canonical build and tests
        timeout-minutes: 15
        shell: pwsh
        run: .\scripts\verify.ps1
