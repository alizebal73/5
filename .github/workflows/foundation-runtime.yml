name: foundation-postgresql-diagnostic

on:
  # PostgreSQL-focused diagnostic lane only; this is not full Foundation certification.
  workflow_dispatch:

concurrency:
  group: foundation-runtime-certification
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  postgres:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PowerShell parser gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($file in Get-ChildItem .\scripts -Recurse -File -Filter *.ps1) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw "PowerShell syntax error in $($file.FullName)."
            }
          }

      - name: PostgreSQL Foundation lane
        shell: pwsh
        run: .\scripts\verify-postgresql.ps1
