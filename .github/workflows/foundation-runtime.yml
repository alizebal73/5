name: foundation-certification

on:
  workflow_dispatch:
  push:
    branches:
      - "foundation/runtime-*"

concurrency:
  group: foundation-runtime-certification
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  postgres:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PowerShell parser gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($file in Get-ChildItem .\scripts -Recurse -File -Filter *.ps1) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw "PowerShell syntax error in $($file.FullName)."
            }
          }

      - name: Canonical Foundation verification
        shell: pwsh
        run: .\scripts\verify.ps1

      - name: PostgreSQL Foundation lane
        shell: pwsh
        run: .\scripts\verify-postgresql.ps1

      - name: Certification evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path .\artifacts\foundation | Out-Null
          @(
            "commit=$(git rev-parse HEAD)"
            "branch=$(git branch --show-current)"
            "timestampUtc=$([DateTime]::UtcNow.ToString('O'))"
            "result=BUILD_TEST_AND_POSTGRESQL_LANES_PASSED"
          ) | Set-Content -LiteralPath .\artifacts\foundation\runtime-evidence.txt -Encoding utf8

      - name: Upload Foundation evidence
        uses: actions/upload-artifact@v4
        with:
          name: foundation-runtime-evidence
          path: artifacts/foundation/runtime-evidence.txt
          if-no-files-found: error
